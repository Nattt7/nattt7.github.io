<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <nav class="max-w-4xl mx-auto px-6 py-8 flex justify-between items-center">
        <div class="text-xl font-bold tracking-tight">YourName.</div>
        <div class="space-x-6 text-sm font-medium text-gray-600">
            <a href="#" class="hover:text-black transition">项目</a>
            <a href="#" class="hover:text-black transition">博客</a>

    <main class="max-w-4xl mx-auto px-6 py-12">
        <section class="mb-16">
            <h1 class="text-5xl font-extrabold mb-6 leading-tight">
                你好，我是 <span class="text-blue-600">你的名字</span> 👋
            </h1>
            <p class="text-xl text-gray-600 leading-relaxed max-w-2xl">
                目前是一名物理学硕士，专注于半导体材料研究。
                我热爱编程、AI 以及 ACGN 文化，正在努力探索科学与技术的交汇点。
            </p>
        </section>

        <section>
            <h2 class="text-2xl font-bold mb-8">精选项目</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md transition">
                    <h3 class="font-bold text-lg mb-2">个人主页项目</h3>
                    <p class="text-gray-500 text-sm mb-4">使用 HTML 和 Tailwind CSS 构建的极简个人网站。</p>

                        <span class="px-2 py-1 bg-green-50 text-green-600 text-xs rounded">CSS</span>
                    </div>
                </div>
                <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md transition">

                    <div class="flex space-x-2">
                        <span class="px-2 py-1 bg-purple-50 text-purple-600 text-xs rounded">Python</span>
                        <span class="px-2 py-1 bg-red-50 text-red-600 text-xs rounded">AI</span>
                    </div>
                </div>
            </div>
        </section>

    <footer class="max-w-4xl mx-auto px-6 py-12 border-t border-gray-100 mt-12 text-center text-gray-400 text-sm">
